<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>התראת סוללה קריטית - HuaweiStickManager</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f2331;
      color: #edf3f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .box {
      background: #162f42;
      border: 2px solid #0284c7;
      padding: 35px 25px;
      border-radius: 14px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(2, 132, 199, 0.25);
      animation: pulse-border 2s infinite ease-in-out;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: #0284c7; box-shadow: 0 0 25px rgba(2, 132, 199, 0.25); }
      50% { border-color: #38bdf8; box-shadow: 0 0 45px rgba(56, 189, 248, 0.45); }
    }
    svg {
      width: 58px;
      height: 58px;
      stroke: #0284c7;
      margin-bottom: 15px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      color: #ffffff;
      font-weight: 800;
    }
    p {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    p strong {
      color: #38bdf8;
    }
    button {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #0369a1;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="17" height="10" rx="2" ry="2"></rect>
      <line x1="22" y1="11" x2="22" y2="13"></line>
      <line x1="11" y1="11" x2="11.01" y2="11"></line>
    </svg>
    <h1>סוללת הסטיק עומדת להתרוקן!</h1>
    <p id="batteryDesc">טוען נתונים...</p>
    <button id="closeBtn">הבנתי, סגור חלון זה</button>
  </div>

  <script src="critical_battery.js"></script>
</body>
</html>
